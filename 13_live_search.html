<!DOCTYPE html>
<html>
<head>
  <title>Live Search</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; }
    input { width: 100%; padding: 10px; box-sizing: border-box; }
    .result { border: 1px solid #ccc; border-radius: 6px; padding: 10px; margin-top: 10px; }
    #status { color: gray; font-size: 13px; }
  </style>
</head>
<body>

  <h2>Search Countries</h2>
  <input id="searchBox" placeholder="Start typing a country name...">
  <p id="status">Loading countries...</p>
  <div id="results"></div>

  <script>
    const searchBox = document.getElementById("searchBox");
    const results = document.getElementById("results");
    const status = document.getElementById("status");
    let countries = [];

    // Backup data, used only if the API cannot be reached
    const backupCountries = [
      { name: "India", capital: "New Delhi" },
      { name: "Indonesia", capital: "Jakarta" },
      { name: "United States", capital: "Washington, D.C." },
      { name: "United Kingdom", capital: "London" },
      { name: "France", capital: "Paris" },
      { name: "Germany", capital: "Berlin" },
      { name: "Italy", capital: "Rome" },
      { name: "Spain", capital: "Madrid" },
      { name: "Japan", capital: "Tokyo" },
      { name: "China", capital: "Beijing" },
      { name: "Australia", capital: "Canberra" },
      { name: "Canada", capital: "Ottawa" },
      { name: "Brazil", capital: "Brasilia" },
      { name: "Russia", capital: "Moscow" },
      { name: "Egypt", capital: "Cairo" },
      { name: "Argentina", capital: "Buenos Aires" }
    ];

    // Step 1: load all countries and capitals once, when the page opens
    async function loadCountries() {
      try {
        const response = await fetch("https://countriesnow.space/api/v0.1/countries/capital");
        if (!response.ok) {
          throw new Error("Server error " + response.status);
        }
        const data = await response.json();
        countries = data.data;
        status.textContent = "Data loaded from the API. Start typing!";
      } catch (error) {
        // Show the real reason, then use the backup list
        countries = backupCountries;
        status.textContent = "API not reachable (" + error.message + "). Using the built-in list.";
      }
    }

    // Step 2: show matching countries every time the user types a letter
    searchBox.addEventListener("input", function () {
      const text = searchBox.value.trim().toLowerCase();

      if (text === "") {
        results.innerHTML = "";
        return;
      }

      let html = "";
      for (let i = 0; i < countries.length; i++) {
        const country = countries[i];

        if (country.name.toLowerCase().includes(text)) {
          let capital = "N/A";
          if (country.capital) {
            capital = country.capital;
          }

          html += '<div class="result">' +
            "<b>" + country.name + "</b><br>" +
            "Capital: " + capital +
            "</div>";
        }
      }

      if (html === "") {
        html = "<p>No results found.</p>";
      }
      results.innerHTML = html;
    });

    loadCountries();
  </script>
</body>
</html>
