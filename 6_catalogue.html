<!DOCTYPE html>
<html>
<head>
  <title>Product Catalogue</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 10px; }
    input, select { padding: 8px; margin: 0 5px 15px 0; }
    .product { border: 1px solid #ccc; padding: 10px; margin-bottom: 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>Product Catalogue</h2>

  <input id="search" placeholder="Search products...">
  <select id="category">
    <option value="All">All</option>
    <option value="Electronics">Electronics</option>
    <option value="Clothing">Clothing</option>
    <option value="Books">Books</option>
  </select>

  <div id="list"></div>

  <script>
    const products = [
      { name: "Laptop",     price: 55000, category: "Electronics" },
      { name: "Headphones", price: 1500,  category: "Electronics" },
      { name: "T-Shirt",    price: 499,   category: "Clothing" },
      { name: "Jeans",      price: 1299,  category: "Clothing" },
      { name: "Python Book", price: 650,  category: "Books" },
      { name: "Novel",      price: 350,   category: "Books" }
    ];

    const search = document.getElementById("search");
    const category = document.getElementById("category");
    const list = document.getElementById("list");

    function show() {
      const text = search.value.toLowerCase();
      const cat = category.value;

      const result = products.filter(p =>
        p.name.toLowerCase().includes(text) &&
        (cat === "All" || p.category === cat)
      );

      list.innerHTML = result.length
        ? result.map(p => `<div class="product"><b>${p.name}</b><br>₹${p.price} | ${p.category}</div>`).join("")
        : "<p>No products found.</p>";
    }

    search.addEventListener("input", show);
    category.addEventListener("change", show);
    show();
  </script>
</body>
</html>
